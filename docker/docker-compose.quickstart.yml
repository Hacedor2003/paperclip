# Quickstart: single-container Paperclip with embedded database.
# Copy this file and set the required env vars before running.
#
#   cd docker
#   export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
#   export ANTHROPIC_API_KEY="sk-ant-..."     # or any other provider key below
#   docker compose -f docker-compose.quickstart.yml up --build
#
# Set at least one provider key. OPENROUTER_API_KEY is the broadest single
# choice: it backs the OpenCode agent across hundreds of models.
#
services:
  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    # Ceiling on processes. The image makes tini PID 1 so orphaned agent
    # descendants are reaped instead of piling up as zombies; this is the
    # backstop if something leaks anyway — the container hits its own limit and
    # dies visibly rather than starving the host of pids.
    pids_limit: 2048
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"

      # ── LLM provider keys (at least one is needed for agents to work) ──
      # One key per agent CLI the image ships (see the `npm install --global`
      # layer in the Dockerfile). A key you leave empty simply means that agent
      # has no credentials — it does not break the others.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"            # Codex
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"      # Claude Code
      # OpenCode is multi-provider. OpenRouter is the one key that reaches the
      # most models, and it is what the native runner's default model uses
      # (openrouter/... — see packages/shared provider-profile.ts).
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"    # OpenCode / OpenRouter
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"            # Gemini CLI
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"            # Gemini CLI (alternative)
      # Kimi reads a model/key pair rather than a bare key.
      KIMI_MODEL_API_KEY: "${KIMI_MODEL_API_KEY:-}"    # Kimi
      KIMI_MODEL_NAME: "${KIMI_MODEL_NAME:-}"          # Kimi

      # ── Deployment settings ──
      # "authenticated" requires login, "local_trusted" skips auth
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      # "private" = LAN only, "public" = internet-facing (use with TLS)
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      # Base URL users will access the UI at
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      # Extra hostnames the instance accepts beyond the public URL host
      # (LAN or Tailscale aliases), comma-separated; empty means none
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      # ── Required secret for session signing (generate with: openssl rand -hex 32) ──
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      # Persistent data directory (database, agent workspaces, uploads)
      - "${PAPERCLIP_DATA_DIR:-../data/docker-paperclip}:/paperclip"
